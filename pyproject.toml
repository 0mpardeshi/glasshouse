[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasshouse"
version = "0.3.0"
description = "A local, dependency-free control room for AI agents: append-only, hash-chained, project-scoped."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Glasshouse contributors" }]
keywords = ["agents", "observability", "audit", "local-first", "ai"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
glasshouse = "glasshouse.cli:main"

[project.urls]
Homepage = "https://github.com/0mpardeshi/glasshouse"

[tool.setuptools]
packages = ["glasshouse"]

[tool.setuptools.package-data]
glasshouse = ["static/*"]
