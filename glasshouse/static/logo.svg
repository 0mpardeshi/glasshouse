<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glasshouse">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0c4"/>
      <stop offset="0.55" stop-color="#5ad0d8"/>
      <stop offset="1" stop-color="#3fb6ff"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff0c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3fb6ff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0b1220"/>
  <rect x="1" y="1" width="62" height="62" rx="13.5" fill="none" stroke="#1d3040"/>

  <!-- conservatory: a glass house, not a sealed box -->
  <path d="M10 27 L32 11 L54 27 V54 H10 Z" fill="url(#pane)" stroke="url(#glass)"
        stroke-width="3" stroke-linejoin="round"/>
  <path d="M32 13.5 V54" stroke="url(#glass)" stroke-width="1.5" opacity="0.55"/>
  <path d="M12 34 H52" stroke="url(#glass)" stroke-width="1.5" opacity="0.45"/>
  <path d="M12 44 H52" stroke="url(#glass)" stroke-width="1.5" opacity="0.35"/>

  <!-- agents on their lanes: one working, one waiting, one stalled -->
  <circle cx="22" cy="39" r="3" fill="#7ff0c4"/>
  <circle cx="32" cy="49" r="3" fill="#3fb6ff"/>
  <circle cx="42" cy="39" r="3" fill="#ffd166"/>

  <!-- the open door: nothing is hidden -->
  <path d="M28 54 V46 H36 V54" fill="#0b1220" stroke="url(#glass)" stroke-width="1.5"/>
</svg>
